{% extends 'layout.html' %}

{% block title %}
  {{ title }}
{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Candles Page</h2>
    <a href="{{ url_for('new_candle') }}" class="btn btn-outline-primary">+ New Candle</a>
  </div>

  <table class="table table-bordered table-striped align-middle">
    <thead class="table-light">
      <tr>
        <th style="width: 10%;">ID</th>
        <th>Candle Image</th>
        <th>Temple Name</th>
        <th style="width: 15%;" class="text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      {% for candle in candles %}
      <tr>
        <td>{{ candle.id }}</td>
        <td>
          <img src="{{ url_for('static', filename='images/' + candle.name) }}" 
               alt="Candle Image" 
               style="max-width: 120px; height: auto;" 
               class="img-thumbnail"
               onerror="this.onerror=null; this.src='https://via.placeholder.com/120x120?text=No+Image';">
        </td>
        <td>{{ candle.temple.name }}</td>
        <td class="text-center">
          <form action="{{ url_for('delete_candle', id=candle.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this candle?');">
            <button type="submit" class="btn btn-danger btn-sm">
              <i class="bi bi-trash"></i> Delete
            </button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4" class="text-center text-muted">No candles found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
